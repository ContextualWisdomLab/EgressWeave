name: Finalize Release Verifier

on:
  push:
    branches: [release/trusted-publishing-readiness]

concurrency:
  group: finalize-release-verifier
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/trusted-publishing-readiness
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Require an empty Unreleased section for published tags
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/verify_distribution.py")
          text = path.read_text(encoding="utf-8")
          constant_marker = '''CHANGELOG_RELEASE_PATTERN = re.compile(
              r"^## \\[(?P<version>\\d+\\.\\d+\\.\\d+)\\] - (?P<date>\\d{4}-\\d{2}-\\d{2})$",
              flags=re.MULTILINE,
          )
          '''
          constant_replacement = constant_marker + '''CHANGELOG_UNRELEASED_PATTERN = re.compile(
              r"^## \\[Unreleased\\]\\s*\\n(?P<body>.*?)(?=^## \\[)",
              flags=re.MULTILINE | re.DOTALL,
          )
          '''
          if text.count(constant_marker) != 1:
              raise SystemExit("release-pattern definition changed unexpectedly")
          text = text.replace(constant_marker, constant_replacement)

          old = '''    if version not in released_versions:
                  raise SystemExit(
                      f"CHANGELOG.md lacks a dated release section for version {version}"
                  )
          '''
          new = old + '''    unreleased_match = CHANGELOG_UNRELEASED_PATTERN.search(changelog)
              if unreleased_match is None:
                  raise SystemExit("CHANGELOG.md lacks the required Unreleased section")
              if unreleased_match.group("body").strip():
                  raise SystemExit(
                      "CHANGELOG.md Unreleased section is not empty; move every entry into "
                      "the dated release section before publishing"
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit("release-ref verification changed unexpectedly")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python -m compileall -q src tests scripts
      - name: Commit verified release gate and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-release-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/verify_distribution.py tests/test_distribution_verifier.py .github/workflows/finalize-release-verifier.yml
          git commit -m "release: require finalized changelog state"
          git push origin HEAD:release/trusted-publishing-readiness
