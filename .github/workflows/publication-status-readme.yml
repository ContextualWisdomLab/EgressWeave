name: Publication Status README

on:
  push:
    branches: [release/trusted-publishing-readiness]

concurrency:
  group: publication-status-readme
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/trusted-publishing-readiness
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Add publication-status boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = """## Install

          ```bash
          pip install egressweave
          ```
          """
          new = """## Publication status

          Release automation and package acceptance establish that a commit is ready
          to publish; they do not establish that an artifact is already available.
          A bare `pip install egressweave` command is authoritative only after the
          exact version appears on a verified PyPI project page with its wheel, source
          distribution, and publish-attestation evidence. Until then, install from a
          reviewed source checkout and preserve the repository's hash-locked validation
          before promoting the package into another system.

          ## Install

          After the target version is verified on PyPI:

          ```bash
          pip install egressweave
          ```

          From a reviewed local checkout before the first public release:

          ```bash
          python -m pip install .
          ```
          """
          if text.count(old) != 1:
              raise SystemExit("README install section changed unexpectedly")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python -m compileall -q src tests scripts
      - name: Commit verified guidance and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/publication-status-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/publication-status-readme.yml
          git commit -m "docs: distinguish publication readiness from availability"
          git push origin HEAD:release/trusted-publishing-readiness
