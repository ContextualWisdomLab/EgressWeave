name: Repair Complete Coverage Test Formatting

on:
  push:
    branches: [quality/coverage-docstring-contract]

concurrency:
  group: repair-complete-coverage-test-formatting
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/coverage-docstring-contract
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: ruff check --fix tests/test_complete_coverage.py
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q src tests scripts
      - name: Commit repair and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/ruff-fix-complete-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_complete_coverage.py .github/workflows/ruff-fix-complete-coverage.yml
          if git diff --cached --quiet; then
            echo "::error::No formatting repair was produced."
            exit 1
          fi
          git commit -m "test: normalize complete-coverage test formatting"
          git push origin HEAD:quality/coverage-docstring-contract
