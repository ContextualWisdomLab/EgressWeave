name: Complete Production Docstrings

on:
  push:
    branches: [quality/coverage-docstring-contract]

concurrency:
  group: complete-production-docstrings
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  document-and-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/coverage-docstring-contract
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Add missing beginner-readable production docstrings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path} changed; refusing an ambiguous docstring replacement"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/egressweave/policy.py",
              '''    def __post_init__(self) -> None:
                  if not isinstance(self.allow_local, bool):
              ''',
              '''    def __post_init__(self) -> None:
                  """Validate and canonicalize every immutable policy field."""
                  if not isinstance(self.allow_local, bool):
              ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''    ) -> None:
                  raise TypeError(
                      "ValidatedEgressURL objects must come from a validation function"
                  )
          ''',
              '''    ) -> None:
                  """Reject direct construction so only completed validation can issue results."""
                  raise TypeError(
                      "ValidatedEgressURL objects must come from a validation function"
                  )
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _has_url_control_character(value: str) -> bool:
              return any(ord(character) < 32 or ord(character) == 127 for character in value)
          ''',
              '''def _has_url_control_character(value: str) -> bool:
              """Return whether URL text contains an ASCII control or DEL character."""
              return any(ord(character) < 32 or ord(character) == 127 for character in value)
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _is_ip_literal(candidate: str) -> bool:
              try:
          ''',
              '''def _is_ip_literal(candidate: str) -> bool:
              """Return whether ``candidate`` is a canonical IPv4 or IPv6 literal."""
              try:
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _looks_like_ip_literal(candidate: str) -> bool:
              compact_candidate = candidate.replace(".", "").lower()
          ''',
              '''def _looks_like_ip_literal(candidate: str) -> bool:
              """Return whether text resembles an alternate numeric IP representation."""
              compact_candidate = candidate.replace(".", "").lower()
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _format_normalized_netloc(hostname: str, port: int, *, explicit_port: bool) -> str:
              host_part = f"[{hostname}]" if ":" in hostname else hostname
          ''',
              '''def _format_normalized_netloc(hostname: str, port: int, *, explicit_port: bool) -> str:
              """Render one canonical URL authority while preserving explicit-port intent."""
              host_part = f"[{hostname}]" if ":" in hostname else hostname
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _parse_and_validate_candidate_url(
              value: str | None,
          ) -> tuple[SplitResult | None, int | None]:
              if value is None:
          ''',
              '''def _parse_and_validate_candidate_url(
              value: str | None,
          ) -> tuple[SplitResult | None, int | None]:
              """Parse candidate text and return its split URL plus effective port."""
              if value is None:
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _validate_url_components(
              parsed: SplitResult,
              hostname: str,
              port: int,
              is_local_dev_host: bool,
              policy: EgressPolicy,
          ) -> None:
              if parsed.scheme.lower() not in {"http", "https"}:
          ''',
              '''def _validate_url_components(
              parsed: SplitResult,
              hostname: str,
              port: int,
              is_local_dev_host: bool,
              policy: EgressPolicy,
          ) -> None:
              """Reject unsafe URL syntax, schemes, credentials, and local-mode use."""
              if parsed.scheme.lower() not in {"http", "https"}:
          ''',
          )
          replace_once(
              "src/egressweave/validation.py",
              '''def _normalize_egress_url(
              value: str | None, policy: EgressPolicy
          ) -> tuple[str | None, str | None, int | None]:
              parsed, port = _parse_and_validate_candidate_url(value)
          ''',
              '''def _normalize_egress_url(
              value: str | None, policy: EgressPolicy
          ) -> tuple[str | None, str | None, int | None]:
              """Return the normalized URL, hostname, and exact authorized port."""
              parsed, port = _parse_and_validate_candidate_url(value)
          ''',
          )
          PY
      - run: ruff check .
      - run: pytest -q
      - name: Record current production coverage gaps
        run: |
          set -o pipefail
          coverage erase
          coverage run -m pytest -q
          coverage report -m || true
      - run: python scripts/ci/hourly_product_guard.py self-test
      - run: python -m compileall -q src tests scripts
      - name: Commit verified docstrings and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/docstring-quality-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/egressweave/policy.py src/egressweave/validation.py .github/workflows/docstring-quality-implementation.yml
          if git diff --cached --quiet; then
            echo "::error::No verified docstring change was produced."
            exit 1
          fi
          git commit -m "docs: complete production definition docstrings"
          git push origin HEAD:quality/coverage-docstring-contract
