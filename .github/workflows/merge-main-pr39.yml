name: One-shot PR39 main integration

on:
  push:
    branches:
      - security/bounded-request-timeouts
    paths:
      - .github/workflows/merge-main-pr39.yml

concurrency:
  group: one-shot-pr39-main-integration
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src
  EXPECTED_FEATURE_PARENT: 96e99dcfa4c9a61f6459e1294fc5bc3052395596
  EXPECTED_MAIN_HEAD: ec2ae177b61931f0daaba8690864d2a61fe5b918

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact helper commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the one-shot source and protected main heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_PARENT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"

      - name: Merge protected main and resolve only the reviewed conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main || true
          python - <<'PY'
          from pathlib import Path

          def resolve_conflicts(path: str, resolver) -> None:
              source = Path(path).read_text(encoding="utf-8")
              output: list[str] = []
              cursor = 0
              while True:
                  start = source.find("<<<<<<< HEAD\n", cursor)
                  if start < 0:
                      output.append(source[cursor:])
                      break
                  middle = source.find("=======\n", start)
                  end = source.find(">>>>>>> origin/main\n", middle)
                  if middle < 0 or end < 0:
                      raise SystemExit(f"malformed conflict markers in {path}")
                  output.append(source[cursor:start])
                  ours = source[start + len("<<<<<<< HEAD\n"):middle]
                  theirs = source[middle + len("=======\n"):end]
                  output.append(resolver(ours, theirs))
                  cursor = end + len(">>>>>>> origin/main\n")
              merged = "".join(output)
              if "<<<<<<<" in merged or ">>>>>>>" in merged or "=======\n" in merged:
                  raise SystemExit(f"unresolved conflict marker in {path}")
              Path(path).write_text(merged, encoding="utf-8")

          def resolve_policy(ours: str, theirs: str) -> str:
              if "finite request-phase timeout ceilings" in ours and "finite DNS candidate" in theirs:
                  return (
                      "HTTP methods those authorities may receive, finite DNS-candidate, request-body,\n"
                      "and response-body budgets, finite request-phase timeout ceilings, and an\n"
                      "``allow_local`` escape hatch for local development stacks: built-in local names\n"
                      "are bound to loopback, while explicit Docker-container names may resolve to\n"
                      "RFC 1918 or RFC 4193 addresses.\n"
                  )
              if "request_timeout_policy" in ours and "max_resolved_addresses" in theirs:
                  return (
                      "    max_resolved_addresses: int = DEFAULT_MAX_RESOLVED_ADDRESSES\n"
                      "    request_timeout_policy: EgressTimeoutPolicy = DEFAULT_EGRESS_TIMEOUT_POLICY\n"
                  )
              raise SystemExit("unexpected policy conflict")

          def resolve_changelog(ours: str, theirs: str) -> str:
              if "request-phase timeout" not in ours or "max_resolved_addresses" not in theirs:
                  raise SystemExit("unexpected changelog conflict")
              return ours + theirs

          resolve_conflicts("src/egressweave/policy.py", resolve_policy)
          resolve_conflicts("CHANGELOG.md", resolve_changelog)
          PY
          git add CHANGELOG.md src/egressweave/policy.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Set up trusted Python toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Verify the integrated tree without repository credentials
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          git diff --check

      - name: Create the reviewed merge commit and remove this helper
        run: |
          set -euo pipefail
          git rm .github/workflows/merge-main-pr39.yml
          git commit -m "merge: integrate bounded DNS candidate policy"
          test "$(git rev-parse HEAD^1)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN_HEAD"

      - name: Publish only the already verified merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            push origin HEAD:security/bounded-request-timeouts
