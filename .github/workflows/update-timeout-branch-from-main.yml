name: Update timeout branch from current main

on:
  push:
    branches:
      - security/bounded-request-timeouts

concurrency:
  group: update-timeout-branch-from-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Merge current protected main without publishing an unverified tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          rm .github/workflows/update-timeout-branch-from-main.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the hash-locked verification toolchain
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Verify the combined DNS and timeout resource policies
        run: |
          set -euo pipefail
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          git diff --check

      - name: Publish the verified merge commit
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: integrate bounded DNS candidate policy"
          git push origin HEAD:security/bounded-request-timeouts
