name: One-shot verified PR 39 main integration

on:
  push:
    branches: [security/bounded-request-timeouts]

concurrency:
  group: sync-pr39-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_MAIN_SHA: ec2ae177b61931f0daaba8690864d2a61fe5b918
  FEATURE_BRANCH: security/bounded-request-timeouts
  PYTHONPATH: src

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge and resolve the exact current main head
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN_SHA"
          merge_status=$?
          set -e
          test "$merge_status" -le 1
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts="$(printf '%s\n' CHANGELOG.md src/egressweave/policy.py | sort)"
          if [ "$conflicts" != "$expected_conflicts" ]; then
            printf 'Unexpected conflicts. Expected:\n%s\nObserved:\n%s\n' \
              "$expected_conflicts" "$conflicts"
            exit 1
          fi
          git checkout --theirs -- CHANGELOG.md src/egressweave/policy.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor")
              return text.replace(old, new, 1)

          path = Path("src/egressweave/policy.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "finite DNS candidate, request-body,\nand response-body budgets, and an ``allow_local`` escape hatch",
              "finite DNS candidate, request-body, response-body, and request-phase\ntimeout budgets, and an ``allow_local`` escape hatch",
              "module documentation",
          )
          text = replace_once(
              text,
              "import idna\n",
              "import idna\n\nfrom egressweave.timeout_policy import (\n"
              "    DEFAULT_EGRESS_TIMEOUT_POLICY,\n"
              "    EgressTimeoutPolicy,\n"
              ")\n",
              "timeout import",
          )
          text = replace_once(
              text,
              "    resource budget.\n\n    ``max_request_bytes``",
              "    resource budget.\n\n"
              "    ``request_timeout_policy`` caps connection establishment, response reads,\n"
              "    request writes, and connection-pool waits. Individual requests may be\n"
              "    stricter but cannot remove or widen any phase bound.\n\n"
              "    ``max_request_bytes``",
              "class documentation",
          )
          text = replace_once(
              text,
              "    max_resolved_addresses: int = DEFAULT_MAX_RESOLVED_ADDRESSES\n",
              "    max_resolved_addresses: int = DEFAULT_MAX_RESOLVED_ADDRESSES\n"
              "    request_timeout_policy: EgressTimeoutPolicy = DEFAULT_EGRESS_TIMEOUT_POLICY\n",
              "field",
          )
          text = replace_once(
              text,
              "        if not isinstance(self.allow_local, bool):\n"
              "            raise TypeError(\"allow_local must be a boolean\")\n\n"
              "        timeout = self.dns_timeout_seconds\n",
              "        if not isinstance(self.allow_local, bool):\n"
              "            raise TypeError(\"allow_local must be a boolean\")\n"
              "        if type(self.request_timeout_policy) is not EgressTimeoutPolicy:\n"
              "            raise TypeError(\n"
              "                \"request_timeout_policy must be an EgressTimeoutPolicy\"\n"
              "            )\n\n"
              "        timeout = self.dns_timeout_seconds\n",
              "validation",
          )
          signature = (
              "        max_resolved_addresses: int | str = DEFAULT_MAX_RESOLVED_ADDRESSES,\n"
              "        max_request_bytes: int | str = DEFAULT_MAX_REQUEST_BYTES,\n"
          )
          replacement = (
              "        max_resolved_addresses: int | str = DEFAULT_MAX_RESOLVED_ADDRESSES,\n"
              "        request_timeout_policy: EgressTimeoutPolicy = DEFAULT_EGRESS_TIMEOUT_POLICY,\n"
              "        max_request_bytes: int | str = DEFAULT_MAX_REQUEST_BYTES,\n"
          )
          if text.count(signature) != 2:
              raise SystemExit("factory signatures: expected two anchors")
          text = text.replace(signature, replacement)
          call = (
              "            max_resolved_addresses=max_resolved_addresses,\n"
              "            max_request_bytes=max_request_bytes,\n"
          )
          replacement_call = (
              "            max_resolved_addresses=max_resolved_addresses,\n"
              "            request_timeout_policy=request_timeout_policy,\n"
              "            max_request_bytes=max_request_bytes,\n"
          )
          if text.count(call) != 2:
              raise SystemExit("factory calls: expected two anchors")
          text = text.replace(call, replacement_call)
          path.write_text(text, encoding="utf-8")

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "### Added\n",
              "### Added\n"
              "- Add frozen `EgressTimeoutPolicy` request-phase ceilings with finite 5-second secure defaults for connect, read, write, and pool waits, consistent constructor injection, audit fingerprint binding, and beginner-readable operator guidance.\n",
              "changelog added",
          )
          text = replace_once(
              text,
              "### Security\n",
              "### Security\n"
              "- Bind every caller-supplied HTTPX request timeout to the injected policy before connection-pool dispatch. Missing or `None` timeout metadata receives finite policy maxima, stricter finite non-negative values are preserved, and wider, malformed, unknown, non-mapping, hostile, boolean, negative, or non-finite values fail with the generic non-leaking policy error.\n",
              "changelog security",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/sync-pr39-main.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify combined policies before publication
        run: |
          set -euo pipefail
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
      - name: Publish only the exact verified merge commit
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test "$current_main" = "$EXPECTED_MAIN_SHA"
          git commit -m "merge: integrate bounded DNS candidate policy"
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
