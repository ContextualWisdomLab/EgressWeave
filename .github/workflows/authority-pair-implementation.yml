name: Exact Authority Pair Implementation

on:
  push:
    branches: [security/exact-authority-pairs]

concurrency:
  group: exact-authority-pair-implementation
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/exact-authority-pairs
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Bind URL validation to exact host-port pairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/egressweave/validation.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''        or parsed.query
                  or parsed.fragment
                  or not policy.allows_port(port)
              ):
          ''',
                  '''        or parsed.query
                  or parsed.fragment
              ):
          ''',
              ),
              (
                  '''def _validate_remote_host_is_allowed(hostname: str, policy: EgressPolicy) -> None:
              allowed_hosts = policy.allowed_hosts
              if not allowed_hosts or any("*" in allowed_host for allowed_host in allowed_hosts):
                  raise EgressNotAllowedError(EGRESS_NOT_ALLOWED)
              if hostname not in allowed_hosts:
                  raise EgressNotAllowedError(EGRESS_NOT_ALLOWED)
              if _is_ip_literal(hostname) or _looks_like_ip_literal(hostname):
                  raise EgressNotAllowedError(EGRESS_NOT_ALLOWED)
          ''',
                  '''def _validate_remote_authority_is_allowed(
              hostname: str, port: int, policy: EgressPolicy
          ) -> None:
              """Reject any hostname and port pair absent from the exact policy."""
              if not policy.allowed_authorities or not policy.allows_authority(
                  hostname, port
              ):
                  raise EgressNotAllowedError(EGRESS_NOT_ALLOWED)
              if _is_ip_literal(hostname) or _looks_like_ip_literal(hostname):
                  raise EgressNotAllowedError(EGRESS_NOT_ALLOWED)
          ''',
              ),
              (
                  '''    _validate_remote_host_is_allowed(hostname, policy)
          ''',
                  '''    _validate_remote_authority_is_allowed(hostname, port, policy)
          ''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(
                      "validation source changed; refusing an ambiguous replacement"
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/ci/hourly_product_guard.py self-test
      - run: python -m compileall -q src tests scripts
      - name: Commit verified implementation and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/authority-pair-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/egressweave/policy.py src/egressweave/validation.py tests/test_authority_pairs.py .github/workflows/authority-pair-implementation.yml
          if git diff --cached --quiet; then
            echo "::error::No verified implementation change was produced."
            exit 1
          fi
          git commit -m "security: enforce exact host-port authority pairs"
          git push origin HEAD:security/exact-authority-pairs
