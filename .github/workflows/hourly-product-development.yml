# cwl-org-commercial-entrypoint: v1
name: Hourly Autonomous Product Development

on:
  workflow_dispatch:

concurrency:
  group: egressweave-hourly-product-development
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  develop:
    name: Discover and package one bounded product gap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.package.outputs.base_sha }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Harden runner
        # audit, not block: the model call now routes through the vendored
        # contextual-orchestrator gateway's live multi-provider discovery
        # (BYTEZ_API_KEY, NVIDIA_NIM_API_KEY[_SUB], OPENROUTER_API_KEY,
        # OPENAI_API_KEY -- see "Provision the contextual-orchestrator gateway
        # sidecar" below), which resolves its own outbound routes at runtime
        # (including https://models.dev for free-tier pricing metadata) and
        # has no fixed host set to pin. This is not a downgrade invented for
        # this repo: it is the exact egress posture ContextualWisdomLab/.github
        # already uses in production for the same sidecar in
        # pr-review-autofix.yml and strix.yml -- no consumer of this sidecar
        # anywhere in the org runs it under block-mode with a static
        # allowlist, because that combination is not yet solved. The actual
        # behavioral boundary against a prompt-injected model stays the
        # deny-by-default OpenCode permission block below (webfetch, websearch,
        # task, skill, lsp, and every bash command but three read-only ones all
        # stay "deny"), which is unaffected by this runner-network setting.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse parallel product development while any pull request is open
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_prs="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --paginate \
              --jq 'length' |
            awk '{total += $1} END {print total + 0}'
          )"
          if [ "$open_prs" -eq 0 ]; then
            echo "develop=true" >>"$GITHUB_OUTPUT"
          else
            echo "develop=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Skipping product development because ${open_prs} pull request(s) remain open."
          fi

      - name: Require the autonomous maintainer gateway credentials
        if: steps.queue.outputs.develop == 'true'
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          present=0
          for secret_name in BYTEZ_API_KEY NVIDIA_NIM_API_KEY NVIDIA_NIM_API_KEY_SUB OPENROUTER_API_KEY OPENAI_API_KEY; do
            value="${!secret_name:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              present=$((present + 1))
            fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::error::At least one of BYTEZ_API_KEY, NVIDIA_NIM_API_KEY, NVIDIA_NIM_API_KEY_SUB, OPENROUTER_API_KEY, OPENAI_API_KEY is required for hourly autonomous product development."
            exit 1
          fi

      - name: Set up Python
        if: steps.queue.outputs.develop == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the trusted base test toolchain
        if: steps.queue.outputs.develop == 'true'
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Prepare a protected immutable diff baseline
        if: steps.queue.outputs.develop == 'true'
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/hourly-pristine"
          git clone --quiet --local --no-hardlinks . "$baseline"
          git -C "$baseline" rev-parse HEAD >"${RUNNER_TEMP}/base-sha"
          sudo chown -R root:root "$baseline" "${RUNNER_TEMP}/base-sha"
          sudo chmod -R a-w "$baseline"
          sudo chmod 0444 "${RUNNER_TEMP}/base-sha"

      - name: Install the pinned OpenCode CLI
        if: steps.queue.outputs.develop == 'true'
        env:
          OPENCODE_VERSION: "1.18.13"
          OPENCODE_SHA256: "8d500b20fed2d26e537e221895b1a575476571b4f0089bb29fb13eeb8eb9e937"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${RUNNER_TEMP}/opencode-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum --check -
          if ! tar --list --gzip --file "$archive" | grep -qx 'opencode'; then
            echo "::error::The reviewed OpenCode archive did not contain the expected executable."
            exit 1
          fi
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" opencode
          chmod 0555 "$install_dir/opencode"
          echo "$install_dir" >>"$GITHUB_PATH"
          observed_version="$("$install_dir/opencode" --version)"
          case "$observed_version" in
            "$OPENCODE_VERSION"|"opencode $OPENCODE_VERSION") ;;
            *)
              echo "::error::The installed OpenCode version did not match the reviewed release."
              exit 1
              ;;
          esac

      - name: Checkout the trusted contextual-orchestrator gateway sidecar source
        if: steps.queue.outputs.develop == 'true'
        env:
          TRUSTED_GATEWAY_SOURCE_SHA: "6958918beaad96d0a67ce264706c828bb7f3f000"
        run: |
          set -euo pipefail
          # Cloned outside $GITHUB_WORKSPACE (not via actions/checkout's
          # workspace-relative `path:`) so this vendored tree never lands
          # inside the git repository that "Enforce the autonomous change
          # boundary" below diffs against the pristine baseline -- an
          # untracked copy of an entire second repository there would be
          # swept into the model's own patch.
          source_dir="${RUNNER_TEMP}/trusted-gateway-source"
          git clone --quiet https://github.com/ContextualWisdomLab/.github.git "$source_dir"
          git -C "$source_dir" -c advice.detachedHead=false checkout --quiet "$TRUSTED_GATEWAY_SOURCE_SHA"
          checked_out="$(git -C "$source_dir" rev-parse HEAD)"
          if [ "$checked_out" != "$TRUSTED_GATEWAY_SOURCE_SHA" ]; then
            echo "::error::vendored ContextualWisdomLab/.github HEAD ${checked_out} != pin ${TRUSTED_GATEWAY_SOURCE_SHA}"
            exit 1
          fi
          echo "TRUSTED_GATEWAY_SOURCE=$source_dir" >>"$GITHUB_ENV"

      - name: Provision the contextual-orchestrator gateway sidecar
        if: steps.queue.outputs.develop == 'true'
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # strix_runs/ is this sidecar's own evidence directory, hardcoded
          # (by the vendored script) to land under $GITHUB_WORKSPACE; it is
          # excluded via .gitignore for the same reason the vendored source
          # checkout above is cloned outside the workspace.
          bash "${TRUSTED_GATEWAY_SOURCE}/scripts/ci/contextual_orchestrator_review_sidecar.sh"

      - name: Run the bounded OpenCode autonomous maintainer
        if: steps.queue.outputs.develop == 'true'
        id: opencode
        env:
          OPENCODE_MODEL: "contextual-orchestrator/orchestrator/free"
          HOME: "${{ runner.temp }}/opencode-home"
          XDG_CONFIG_HOME: "${{ runner.temp }}/opencode-home/config"
          XDG_DATA_HOME: "${{ runner.temp }}/opencode-home/data"
          XDG_CACHE_HOME: "${{ runner.temp }}/opencode-home/cache"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_MODELS_FETCH: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_DISABLE_CLAUDE_CODE: "true"
          OPENCODE_AUTO_SHARE: "false"
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json","model":"contextual-orchestrator/orchestrator/free","small_model":"contextual-orchestrator/orchestrator/free","share":"disabled","autoupdate":false,"provider":{"contextual-orchestrator":{"npm":"@ai-sdk/openai-compatible","name":"Contextual Orchestrator Gateway","options":{"baseURL":"{env:CONTEXTUAL_ORCHESTRATOR_BASE_URL}","apiKey":"{env:CONTEXTUAL_ORCHESTRATOR_TOKEN}"},"models":{"orchestrator/free":{"name":"Orchestrator Free (ZDR-first zero-cost pool)","tool_call":true,"reasoning":true,"limit":{"context":200000,"output":32768}}}}},"permission":{"*":"deny","read":{"*":"allow",".git/**":"deny","*.env":"deny","*.env.*":"deny"},"edit":{"*":"deny","src/egressweave/**":"allow","tests/**":"allow","docs/**":"allow","README.md":"allow","CHANGELOG.md":"allow"},"glob":"allow","grep":"allow","bash":{"*":"deny","git diff --check":"allow","git diff --stat":"allow","git status --short":"allow"},"external_directory":"deny","webfetch":"deny","websearch":"deny","question":"deny","task":"deny","skill":"deny"}}
        run: |
          set -euo pipefail
          if [ -z "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" ] || [ -z "${CONTEXTUAL_ORCHESTRATOR_TOKEN_FILE:-}" ]; then
            echo "::error::The contextual-orchestrator gateway sidecar must be provisioned before the autonomous maintainer runs."
            exit 1
          fi
          # Loads and masks CONTEXTUAL_ORCHESTRATOR_TOKEN from the sidecar's
          # owner/mode-validated token file into THIS step's shell only -- the
          # raw bearer never crosses a step boundary via $GITHUB_ENV.
          source "${TRUSTED_GATEWAY_SOURCE}/scripts/ci/load_contextual_orchestrator_token.sh"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          chmod 0700 "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          prompt_file="${RUNNER_TEMP}/opencode-prompt.md"
          prompt_source="$GITHUB_WORKSPACE/.github/prompts/hourly-product-maintainer.md"
          result_file="${RUNNER_TEMP}/opencode-result.ndjson"
          if [ ! -f "$prompt_source" ] || [ -L "$prompt_source" ]; then
            echo "::error::The canonical hourly maintainer prompt is missing or unsafe."
            exit 1
          fi
          prompt_bytes="$(wc -c <"$prompt_source" | tr -d '[:space:]')"
          if [[ ! "$prompt_bytes" =~ ^[0-9]+$ ]] || [ "$prompt_bytes" -gt 12000 ]; then
            echo "::error::The canonical hourly maintainer prompt exceeds the 12 KiB control-plane budget."
            exit 1
          fi
          cp -- "$prompt_source" "$prompt_file"
          chmod 0444 "$prompt_file"
          opencode run --auto --model "$OPENCODE_MODEL" --format json \
            "$(cat "$prompt_file")" >"$result_file"
          if [ ! -s "$result_file" ]; then
            echo "::error::OpenCode produced no auditable result."
            exit 1
          fi

      - name: Reject model credential disclosure
        if: steps.queue.outputs.develop == 'true'
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # None of the five real provider keys are ever this job's OpenCode
          # process's own environment (only the gateway sidecar process ever
          # holds them, seeded once into its in-memory KV); this scan is
          # defense in depth in case the gateway ever echoed one back. The
          # ephemeral per-run CONTEXTUAL_ORCHESTRATOR_TOKEN, which IS in that
          # environment, is scanned for the same reason the old NVIDIA_API_KEY
          # value was.
          source "${TRUSTED_GATEWAY_SOURCE}/scripts/ci/load_contextual_orchestrator_token.sh"
          result_file="${RUNNER_TEMP}/opencode-result.ndjson"
          disclosure_file="${RUNNER_TEMP}/credential-disclosure-paths"
          : >"$disclosure_file"
          for secret_name in BYTEZ_API_KEY NVIDIA_NIM_API_KEY NVIDIA_NIM_API_KEY_SUB \
            OPENROUTER_API_KEY OPENAI_API_KEY CONTEXTUAL_ORCHESTRATOR_TOKEN; do
            value="${!secret_name:-}"
            [ -n "$value" ] || continue
            grep -R -F -l -- "$value" \
              src/egressweave tests docs README.md CHANGELOG.md "$result_file" \
              >>"$disclosure_file" || true
          done
          if [ -s "$disclosure_file" ]; then
            echo "::error::The model disclosed a credential in the following path(s):"
            sort -u -- "$disclosure_file" | sed 's/^/::error::/'
            exit 1
          fi

      - name: Preserve the OpenCode result outside the source tree
        if: steps.queue.outputs.develop == 'true'
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/opencode-result.ndjson"
          if [ ! -s "$result_file" ]; then
            printf '%s\n' '{"type":"error","message":"OpenCode produced no final result"}' >"$result_file"
            exit 1
          fi

      - name: Enforce the autonomous change boundary and package the patch
        if: steps.queue.outputs.develop == 'true'
        id: package
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/hourly-pristine/scripts/ci/hourly_product_guard.py" capture \
            --workspace "$GITHUB_WORKSPACE" \
            --baseline "${RUNNER_TEMP}/hourly-pristine" \
            --base-sha-file "${RUNNER_TEMP}/base-sha" \
            --patch-file "${RUNNER_TEMP}/egressweave.patch" \
            --stat-file "${RUNNER_TEMP}/egressweave.stat"

      - name: Upload the bounded change for credential-free reverification
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hourly-product-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/egressweave.patch
            ${{ runner.temp }}/egressweave.stat
            ${{ runner.temp }}/opencode-result.ndjson
            ${{ runner.temp }}/base-sha
          if-no-files-found: error
          retention-days: 3

  reverify:
    name: Independently reverify the autonomous change
    needs: develop
    if: needs.develop.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      VERIFIER_BASE_IMAGE: "python@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out a fresh protected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download the bounded change
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hourly-product-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hourly-product-change

      - name: Recheck the zero-PR and unchanged-base preconditions
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          open_prs="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --paginate \
              --jq 'length' |
            awk '{total += $1} END {print total + 0}'
          )"
          if [ "$open_prs" -ne 0 ] || [ "$current_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "verify=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Discarding the bounded patch because repository state changed before reverification."
            exit 0
          fi
          echo "verify=true" >>"$GITHUB_OUTPUT"

      - name: Require the exact handoff base before applying the patch
        if: steps.gate.outputs.verify == 'true'
        env:
          EXPECTED_BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          handoff_base_sha_file="${RUNNER_TEMP}/hourly-product-change/base-sha"
          current_sha="$(git rev-parse HEAD)"
          handoff_base_sha="$(cat "$handoff_base_sha_file")"
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$handoff_base_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$current_sha" != "$EXPECTED_BASE_SHA" ] || \
             [ "$handoff_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::The patch handoff base does not match the exact checkout."
            exit 1
          fi

      - name: Build a trusted verifier image before applying the patch
        if: steps.gate.outputs.verify == 'true'
        id: verifier_image
        run: |
          set -euo pipefail
          context="${RUNNER_TEMP}/egressweave-verifier-context"
          image_tag="egressweave-verifier:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$context"
          cp requirements-ci.txt "$context/"

          if [[ ! "$VERIFIER_BASE_IMAGE" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The verifier base image is not an immutable reviewed Python digest."
            exit 1
          fi
          docker pull "$VERIFIER_BASE_IMAGE"
          cat >"$context/Dockerfile" <<DOCKERFILE
          FROM ${VERIFIER_BASE_IMAGE}
          ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PIP_NO_CACHE_DIR=1 \
              PYTHONUNBUFFERED=1
          WORKDIR /trusted-base
          COPY requirements-ci.txt ./
          RUN python -m pip install --require-hashes -r requirements-ci.txt
          WORKDIR /work
          DOCKERFILE
          docker build --pull=false --network=default --tag "$image_tag" "$context"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The verifier image did not resolve to an immutable image ID."
            exit 1
          fi
          echo "image_id=$image_id" >>"$GITHUB_OUTPUT"

      - name: Validate, apply, and seal the untrusted patch
        if: steps.gate.outputs.verify == 'true'
        env:
          EXPECTED_BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/hourly-product-change/egressweave.patch"
          result_file="${RUNNER_TEMP}/reverify-result.json"
          python scripts/ci/hourly_product_guard.py apply \
            --workspace "$GITHUB_WORKSPACE" \
            --patch-file "$patch_file" \
            --result-file "$result_file"
          result_base_sha="$(jq -r ".base_sha" "$result_file")"
          if [ "$result_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::The verified result base SHA does not match the exact handoff base."
            exit 1
          fi

          sealed_dir="/opt/egressweave-reverify"
          sudo install -d -m 0555 -o root -g root "$sealed_dir"
          sudo install -m 0444 -o root -g root "$patch_file" "$sealed_dir/egressweave.patch"
          printf '%s\n' "$EXPECTED_BASE_SHA" | sudo tee "$sealed_dir/base-sha" >/dev/null
          jq -r '.patch_sha256' "$result_file" | sudo tee "$sealed_dir/patch-sha256" >/dev/null
          sudo chown root:root "$sealed_dir/base-sha" "$sealed_dir/patch-sha256"
          sudo chmod 0444 "$sealed_dir/base-sha" "$sealed_dir/patch-sha256"

      - name: Test only inside the offline least-privilege verifier container
        if: steps.gate.outputs.verify == 'true'
        env:
          VERIFIER_IMAGE_ID: ${{ steps.verifier_image.outputs.image_id }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIER_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The verifier image ID is missing or malformed."
            exit 1
          fi
          docker run --rm \
            --network none \
            --ipc none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0755 \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --env HOME=/tmp/home \
            --env PYTHONPATH=/work/src \
            --env PYTHONNOUSERSITE=1 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --workdir /work \
            "$VERIFIER_IMAGE_ID" \
            sh -euc '
              mkdir -p "$HOME"
              cp -R --no-preserve=ownership,mode,timestamps \
                /source/src /source/tests /source/docs /source/.github /source/scripts \
                /work/
              for root_file in /source/* /source/.[!.]* /source/..?*; do
                [ -f "$root_file" ] && [ ! -L "$root_file" ] || continue
                cp --no-preserve=ownership,mode,timestamps "$root_file" /work/
              done
              ruff check .
              pytest -q
              python -m compileall -q src tests scripts
            '

      - name: Recheck the independently verified immutable patch
        if: steps.gate.outputs.verify == 'true'
        env:
          EXPECTED_BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          sealed_dir="/opt/egressweave-reverify"
          observed="$(sha256sum "$sealed_dir/egressweave.patch" | awk '{print $1}')"
          expected="$(cat "$sealed_dir/patch-sha256")"
          if [ "$observed" != "$expected" ]; then
            echo "::error::The sealed patch changed during independent verification."
            exit 1
          fi
          base_sha="$(cat "$sealed_dir/base-sha")"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::The sealed base SHA does not match the exact handoff base."
            exit 1
          fi

      - name: Upload the independently verified handoff
        if: steps.gate.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hourly-verified-product-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /opt/egressweave-reverify/egressweave.patch
            /opt/egressweave-reverify/base-sha
            /opt/egressweave-reverify/patch-sha256
          if-no-files-found: error
          retention-days: 3
