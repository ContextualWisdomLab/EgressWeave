name: PR 32 implementation bootstrap

on:
  push:
    branches:
      - security/request-body-resource-limits

concurrency:
  group: pr32-implementation-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/request-body-resource-limits
          fetch-depth: 1
          persist-credentials: true
      - name: Apply the bounded reviewed implementation
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/pr32.tar.gz.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "${RUNNER_TEMP}/pr32.tar.gz.b64" >"${RUNNER_TEMP}/pr32.tar.gz"
          expected_paths="$(cat <<'PATHS'
CHANGELOG.md
docs/research/request-body-resource-limits.md
src/egressweave/decision_evidence.py
src/egressweave/policy.py
src/egressweave/request_body_safety.py
src/egressweave/sync_transport.py
src/egressweave/transport.py
PATHS
)"
          observed_paths="$(tar -tzf "${RUNNER_TEMP}/pr32.tar.gz" | sort)"
          test "$observed_paths" = "$expected_paths"
          tar -xzf "${RUNNER_TEMP}/pr32.tar.gz"
          rm .github/workflows/pr32-implementation-bootstrap.yml
      - name: Install the hash-locked verification toolchain
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify the complete implementation
        run: |
          set -euo pipefail
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          git diff --check
      - name: Commit the verified bounded implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            docs/research/request-body-resource-limits.md \
            src/egressweave/decision_evidence.py \
            src/egressweave/policy.py \
            src/egressweave/request_body_safety.py \
            src/egressweave/sync_transport.py \
            src/egressweave/transport.py
          git add -u .github/workflows/pr32-implementation-bootstrap.yml
          git commit -m "security: enforce outbound request-body limits"
          git push origin HEAD:security/request-body-resource-limits
