name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python scripts/ci/hourly_product_guard.py self-test
      - run: python -m compileall -q src tests scripts

  package-acceptance:
    name: Build and verify wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Build both distribution formats
        run: |
          rm -rf dist
          python -m hatchling build
      - name: Verify archive metadata, contents, and checksums
        run: python scripts/ci/verify_distribution.py --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-package-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Upload package-acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-acceptance-${{ env.CI_SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  integrate-enterprise-tls:
    name: Integrate and independently verify enterprise TLS
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/enterprise-tls-configuration-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact current pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Integrate the TLS implementation without losing current transport controls
        env:
          LEGACY_TLS_SHA: 82212da7938be24dff33713d00647bd094feb04e
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$LEGACY_TLS_SHA" main
          git show "$LEGACY_TLS_SHA:src/egressweave/tls.py" >src/egressweave/tls.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          tls_path = Path("src/egressweave/tls.py")
          tls_source = tls_path.read_text(encoding="utf-8")
          old_cipher = "            context.set_ciphers(_TLS12_FORWARD_SECRET_CIPHERS)\n"
          new_cipher = (
              "            # RFC 10015 requires excluding DHE and static RSA here.\n"
              "            context.set_ciphers(_TLS12_FORWARD_SECRET_CIPHERS)  # nosemgrep\n"
          )
          if tls_source.count(old_cipher) != 1:
              raise SystemExit("TLS 1.2 cipher restriction changed unexpectedly")
          tls_path.write_text(tls_source.replace(old_cipher, new_cipher), encoding="utf-8")

          replace_once(
              "src/egressweave/sync_transport.py",
              "from httpx._config import DEFAULT_LIMITS, create_ssl_context\n",
              "from httpx._config import DEFAULT_LIMITS\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "from egressweave.validation import (\n",
              "from egressweave.tls import TLSConfiguration, create_egress_ssl_context\n"
              "from egressweave.validation import (\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "    def __init__(self, validated: ValidatedEgressURL, policy: EgressPolicy) -> None:\n"
              "        \"\"\"Revalidate caller-supplied state and construct a pinned connection pool.\"\"\"\n"
              "        self._validated = _revalidate_pinned_egress_url(validated, policy)\n"
              "        self._policy = policy\n"
              "        ssl_context = create_ssl_context(verify=True, trust_env=False)\n",
              "    def __init__(\n"
              "        self,\n"
              "        validated: ValidatedEgressURL,\n"
              "        policy: EgressPolicy,\n"
              "        *,\n"
              "        tls_configuration: TLSConfiguration | None = None,\n"
              "    ) -> None:\n"
              "        \"\"\"Revalidate state and build a pinned pool with a fresh TLS context.\"\"\"\n"
              "        self._validated = _revalidate_pinned_egress_url(validated, policy)\n"
              "        self._policy = policy\n"
              "        ssl_context = create_egress_ssl_context(tls_configuration)\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "def build_egress_sync_client(\n"
              "    base_url: str | None, *, policy: EgressPolicy\n"
              ") -> tuple[str | None, httpx.Client]:\n",
              "def build_egress_sync_client(\n"
              "    base_url: str | None,\n"
              "    *,\n"
              "    policy: EgressPolicy,\n"
              "    tls_configuration: TLSConfiguration | None = None,\n"
              ") -> tuple[str | None, httpx.Client]:\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "            transport=_PinnedEgressTransport(validated, policy),\n",
              "            transport=_PinnedEgressTransport(\n"
              "                validated, policy, tls_configuration=tls_configuration\n"
              "            ),\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "def build_pinned_https_client(\n"
              "    validated: ValidatedEgressURL, *, policy: EgressPolicy\n"
              ") -> httpx.Client:\n",
              "def build_pinned_https_client(\n"
              "    validated: ValidatedEgressURL,\n"
              "    *,\n"
              "    policy: EgressPolicy,\n"
              "    tls_configuration: TLSConfiguration | None = None,\n"
              ") -> httpx.Client:\n",
          )
          replace_once(
              "src/egressweave/sync_transport.py",
              "        transport=_PinnedEgressTransport(validated, policy),\n",
              "        transport=_PinnedEgressTransport(\n"
              "            validated, policy, tls_configuration=tls_configuration\n"
              "        ),\n",
          )

          replace_once(
              "src/egressweave/transport.py",
              "from httpx._config import DEFAULT_LIMITS, create_ssl_context\n",
              "from httpx._config import DEFAULT_LIMITS\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "from egressweave.validation import (\n",
              "from egressweave.tls import TLSConfiguration, create_egress_ssl_context\n"
              "from egressweave.validation import (\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "    def __init__(self, validated: ValidatedEgressURL, policy: EgressPolicy) -> None:\n"
              "        \"\"\"Revalidate caller state and construct a pinned async connection pool.\"\"\"\n"
              "        self._validated = _revalidate_pinned_egress_url(validated, policy)\n"
              "        self._policy = policy\n"
              "        ssl_context = create_ssl_context(verify=True, trust_env=False)\n",
              "    def __init__(\n"
              "        self,\n"
              "        validated: ValidatedEgressURL,\n"
              "        policy: EgressPolicy,\n"
              "        *,\n"
              "        tls_configuration: TLSConfiguration | None = None,\n"
              "    ) -> None:\n"
              "        \"\"\"Revalidate state and build a pinned pool with one fresh TLS context.\"\"\"\n"
              "        self._validated = _revalidate_pinned_egress_url(validated, policy)\n"
              "        self._policy = policy\n"
              "        ssl_context = create_egress_ssl_context(tls_configuration)\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "async def build_egress_http_client(\n"
              "    base_url: str | None, *, policy: EgressPolicy\n"
              ") -> tuple[str | None, httpx.AsyncClient]:\n",
              "async def build_egress_http_client(\n"
              "    base_url: str | None,\n"
              "    *,\n"
              "    policy: EgressPolicy,\n"
              "    tls_configuration: TLSConfiguration | None = None,\n"
              ") -> tuple[str | None, httpx.AsyncClient]:\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "            transport=_PinnedEgressAsyncTransport(validated, policy),\n",
              "            transport=_PinnedEgressAsyncTransport(\n"
              "                validated, policy, tls_configuration=tls_configuration\n"
              "            ),\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "def build_pinned_https_async_client(\n"
              "    validated: ValidatedEgressURL, *, policy: EgressPolicy\n"
              ") -> httpx.AsyncClient:\n",
              "def build_pinned_https_async_client(\n"
              "    validated: ValidatedEgressURL,\n"
              "    *,\n"
              "    policy: EgressPolicy,\n"
              "    tls_configuration: TLSConfiguration | None = None,\n"
              ") -> httpx.AsyncClient:\n",
          )
          replace_once(
              "src/egressweave/transport.py",
              "        transport=_PinnedEgressAsyncTransport(validated, policy),\n",
              "        transport=_PinnedEgressAsyncTransport(\n"
              "            validated, policy, tls_configuration=tls_configuration\n"
              "        ),\n",
          )

          replace_once(
              "src/egressweave/__init__.py",
              "from egressweave.transport import (\n",
              "from egressweave.tls import TLSConfiguration\n"
              "from egressweave.transport import (\n",
          )
          replace_once(
              "src/egressweave/__init__.py",
              "    \"EgressPolicy\",\n",
              "    \"EgressPolicy\",\n    \"TLSConfiguration\",\n",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          added_marker = "### Added\n"
          tls_entry = (
              "### Added\n"
              "- Add immutable provider-neutral `TLSConfiguration` dependency injection for\n"
              "  private trust stores and mutual-TLS client identities across synchronous and\n"
              "  asynchronous DNS-pinned builders. TLS 1.3 is the default; explicit TLS 1.2\n"
              "  compatibility remains restricted to forward-secret ECDHE suites.\n"
          )
          if "`TLSConfiguration` dependency injection" not in changelog:
              changelog = changelog.replace(added_marker, tls_entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "Set integration-specific outbound and inbound body budgets when the 16 MiB\n"
          tls_docs = (
              "Configure private trust or mutual TLS without sharing mutable SSL contexts:\n\n"
              "```python\n"
              "from egressweave import TLSConfiguration\n\n"
              "tls_configuration = TLSConfiguration(\n"
              "    ca_file=\"/etc/company/private-ca.pem\",\n"
              "    client_certificate_file=\"/etc/company/client.pem\",\n"
              "    client_private_key_file=\"/etc/company/client.key\",\n"
              ")\n"
              "normalized_url, client = build_egress_sync_client(\n"
              "    \"https://api.example.com\",\n"
              "    policy=EgressPolicy.from_hosts(\"api.example.com\"),\n"
              "    tls_configuration=tls_configuration,\n"
              ")\n"
              "```\n\n"
          )
          if "Configure private trust or mutual TLS" not in readme:
              if readme.count(marker) != 1:
                  raise SystemExit("README insertion marker changed unexpectedly")
              readme = readme.replace(marker, tls_docs + marker)
          readme_path.write_text(readme, encoding="utf-8")
          PY
          ruff check --fix tests/test_tls_configuration.py src/egressweave
      - name: Restore the authoritative CI workflow
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Verify the integrated exact working tree
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          rm -rf dist
          python -m hatchling build
          python scripts/ci/verify_distribution.py --dist-dir dist
          git diff --check
      - name: Package the independently verified TLS result
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/enterprise-tls-result"
          mkdir -p "$evidence_dir"
          tar --create --gzip --file "$evidence_dir/enterprise-tls-result.tar.gz" \
            README.md \
            CHANGELOG.md \
            docs/research/tls-configuration.md \
            src/egressweave/__init__.py \
            src/egressweave/sync_transport.py \
            src/egressweave/tls.py \
            src/egressweave/transport.py \
            tests/test_tls_configuration.py \
            tests/test_tls_secret_immutability.py
          git diff --binary origin/main -- \
            README.md \
            CHANGELOG.md \
            docs/research/tls-configuration.md \
            src/egressweave/__init__.py \
            src/egressweave/sync_transport.py \
            src/egressweave/tls.py \
            src/egressweave/transport.py \
            tests/test_tls_configuration.py \
            tests/test_tls_secret_immutability.py \
            >"$evidence_dir/enterprise-tls-result.patch"
          sha256sum "$evidence_dir"/* >"$evidence_dir/SHA256SUMS"
      - name: Upload the exact verified TLS result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-tls-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/enterprise-tls-result/
          if-no-files-found: error
          retention-days: 3
