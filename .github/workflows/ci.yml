name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python scripts/ci/hourly_product_guard.py self-test
      - run: python -m compileall -q src tests scripts

  package-acceptance:
    name: Build and verify wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Build both distribution formats
        run: |
          rm -rf dist
          python -m hatchling build
      - name: Verify archive metadata, contents, and checksums
        run: python scripts/ci/verify_distribution.py --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-package-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Upload package-acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-acceptance-${{ env.CI_SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  apply-opencode-nvidia-migration:
    name: Apply and independently verify the OpenCode NVIDIA migration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ci/opencode-nvidia-hourly-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the exact current pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Apply the reviewed deterministic migration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          migration_path = Path(".github/workflows/migrate-opencode-nvidia.yml")
          migration = migration_path.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if migration.count(start_marker) != 1 or migration.count(end_marker) != 1:
              raise SystemExit("migration script markers changed unexpectedly")
          script = migration.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), str(migration_path), "exec"))
          documentation_path = Path("docs/hourly-autonomous-maintenance.md")
          documentation_path.write_text(
              documentation_path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Restore the authoritative CI workflow and remove the one-shot bootstrap
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/migrate-opencode-nvidia.yml
      - name: Verify the exact migrated working tree
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          git diff --check
      - name: Package the independently verified migration result
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/opencode-migration-result"
          mkdir -p "$evidence_dir"
          cp .github/workflows/hourly-product-development.yml "$evidence_dir/hourly-product-development.yml"
          cp CHANGELOG.md "$evidence_dir/CHANGELOG.md"
          cp docs/hourly-autonomous-maintenance.md "$evidence_dir/hourly-autonomous-maintenance.md"
          git diff --binary origin/main -- \
            .github/workflows/hourly-product-development.yml \
            CHANGELOG.md \
            docs/hourly-autonomous-maintenance.md \
            >"$evidence_dir/migration.patch"
          sha256sum "$evidence_dir"/* >"$evidence_dir/SHA256SUMS"
      - name: Upload the exact verified migration result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-migration-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/opencode-migration-result/
          if-no-files-found: error
          retention-days: 3
      - name: Commit and push only the verified final migration
        env:
          WORKFLOW_WRITE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOW_WRITE_TOKEN:-}" ]; then
            echo "::error::A workflow-capable external write token is required."
            exit 1
          fi
          echo "::add-mask::$WORKFLOW_WRITE_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows CHANGELOG.md docs/hourly-autonomous-maintenance.md
          if git diff --cached --quiet; then
            echo "::error::The migration produced no final repository change."
            exit 1
          fi
          git commit -m "ci: migrate hourly product development to NVIDIA OpenCode"
          git remote set-url origin "https://x-access-token:${WORKFLOW_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:ci/opencode-nvidia-hourly-agent
