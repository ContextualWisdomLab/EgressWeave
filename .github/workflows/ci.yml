name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python scripts/ci/hourly_product_guard.py self-test
      - run: python -m compileall -q src tests scripts

  package-acceptance:
    name: Build and verify wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Build both distribution formats
        run: |
          rm -rf dist
          python -m hatchling build
      - name: Verify archive metadata, contents, and checksums
        run: python scripts/ci/verify_distribution.py --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-package-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Upload package-acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-acceptance-${{ env.CI_SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  integrate-enterprise-tls:
    name: Integrate and independently verify enterprise TLS
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/enterprise-tls-configuration-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact current pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Integrate the reviewed TLS slice onto the current main lineage
        env:
          LEGACY_BASE_SHA: af1fd7ddb6bd0581edcdf2b8030b638a5e407bde
          LEGACY_TLS_SHA: 82212da7938be24dff33713d00647bd094feb04e
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$LEGACY_BASE_SHA" "$LEGACY_TLS_SHA" main
          git diff --binary "$LEGACY_BASE_SHA" "$LEGACY_TLS_SHA" -- \
            README.md \
            CHANGELOG.md \
            src/egressweave/__init__.py \
            src/egressweave/sync_transport.py \
            src/egressweave/transport.py \
            >"${RUNNER_TEMP}/enterprise-tls-production.patch"
          git apply --3way --index "${RUNNER_TEMP}/enterprise-tls-production.patch"
          git show "$LEGACY_TLS_SHA:src/egressweave/tls.py" >src/egressweave/tls.py
          python - <<'PY'
          from pathlib import Path

          tls_path = Path("src/egressweave/tls.py")
          tls_source = tls_path.read_text(encoding="utf-8")
          old = "            context.set_ciphers(_TLS12_FORWARD_SECRET_CIPHERS)\n"
          new = (
              "            # RFC 10015 requires excluding DHE and static RSA here.\n"
              "            context.set_ciphers(_TLS12_FORWARD_SECRET_CIPHERS)  # nosemgrep\n"
          )
          if tls_source.count(old) != 1:
              raise SystemExit("TLS 1.2 cipher restriction changed unexpectedly")
          tls_path.write_text(tls_source.replace(old, new), encoding="utf-8")
          PY
          ruff check --fix tests/test_tls_configuration.py
      - name: Restore the authoritative CI workflow
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Verify the integrated exact working tree
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          rm -rf dist
          python -m hatchling build
          python scripts/ci/verify_distribution.py --dist-dir dist
          git diff --check
      - name: Package the independently verified TLS result
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/enterprise-tls-result"
          mkdir -p "$evidence_dir"
          tar --create --gzip --file "$evidence_dir/enterprise-tls-result.tar.gz" \
            README.md \
            CHANGELOG.md \
            docs/research/tls-configuration.md \
            src/egressweave/__init__.py \
            src/egressweave/sync_transport.py \
            src/egressweave/tls.py \
            src/egressweave/transport.py \
            tests/test_tls_configuration.py \
            tests/test_tls_secret_immutability.py
          git diff --binary origin/main -- \
            README.md \
            CHANGELOG.md \
            docs/research/tls-configuration.md \
            src/egressweave/__init__.py \
            src/egressweave/sync_transport.py \
            src/egressweave/tls.py \
            src/egressweave/transport.py \
            tests/test_tls_configuration.py \
            tests/test_tls_secret_immutability.py \
            >"$evidence_dir/enterprise-tls-result.patch"
          sha256sum "$evidence_dir"/* >"$evidence_dir/SHA256SUMS"
      - name: Upload the exact verified TLS result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-tls-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/enterprise-tls-result/
          if-no-files-found: error
          retention-days: 3
