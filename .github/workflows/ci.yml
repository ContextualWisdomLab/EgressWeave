name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  implement-timeout-policy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'security/bounded-request-timeouts' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Apply the reviewed implementation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python .github/implement_request_timeout_policy.py
          rm .github/implement_request_timeout_policy.py
          git show "${BASE_SHA}:.github/workflows/ci.yml" > .github/workflows/ci.yml
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify the implementation before publication
        run: |
          set -euo pipefail
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
          git diff --check
      - name: Commit the verified implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: enforce finite outbound request timeouts"
          git push origin HEAD:security/bounded-request-timeouts
