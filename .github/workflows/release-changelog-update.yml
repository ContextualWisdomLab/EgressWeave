name: Release Readiness Changelog Update

on:
  push:
    branches: [release/trusted-publishing-readiness]

concurrency:
  group: release-readiness-changelog-update
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/trusted-publishing-readiness
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Record package and Trusted Publishing gates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = """### Added
          - Enforce 100% production statement and branch coverage on every supported
          """
          replacement = """### Added
          - Add pull-request package acceptance for wheel and source distributions,
            including SPDX license metadata, archive path validation, PEP 561 marker
            checks, installed-wheel smoke testing outside the source tree, and
            deterministic `SHA256SUMS` evidence.
          - Add a credential-separated release workflow that rebuilds an immutable
            published tag with hash-locked Hatchling tooling, verifies version and
            dated changelog binding, publishes through PyPI Trusted Publishing with
            attestations, and attaches checksummed artifacts to the GitHub Release.
          - Enforce 100% production statement and branch coverage on every supported
          """
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG Added section changed unexpectedly")
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY
      - run: ruff check .
      - run: coverage run -m pytest -q
      - run: coverage report -m
      - run: python -m compileall -q src tests scripts
      - name: Commit verified changelog and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/release-changelog-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/release-changelog-update.yml
          git commit -m "docs: record trusted release gates"
          git push origin HEAD:release/trusted-publishing-readiness
