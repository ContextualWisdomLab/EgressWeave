name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag in v<version> form
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  build-distributions:
    name: Build and verify release distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify stable release input and exact reviewed commit
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Stable publication must be dispatched from protected main."
            exit 1
          fi
          git fetch --no-tags origin main
          checked_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$checked_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked-out source does not match the workflow event commit."
            exit 1
          fi
          if [ "$checked_sha" != "$main_sha" ]; then
            echo "::error::Release source must equal the exact protected main head."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::A stable v<version> release tag is required."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Re-run exact-head quality gates
        run: |
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
      - name: Build wheel and source distribution
        run: |
          rm -rf dist publish-dist
          python -m hatchling build
      - name: Verify archives and bind them to the requested release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/ci/verify_distribution.py --release-ref "$RELEASE_TAG" --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-release-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Prepare the canonical PyPI-only artifact set
        run: |
          set -euo pipefail
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
          (
            cd publish-dist
            sha256sum --check --strict ../dist/SHA256SUMS
          )
      - name: Upload complete checksummed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload canonical PyPI distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions-${{ github.sha }}
          path: publish-dist/
          if-no-files-found: error
          retention-days: 14

  verify-release-evidence:
    name: Verify exact protected-main release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require integrating pull request for exact release commit
        id: integrating_pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pull_pages="$(mktemp)"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls?per_page=100" \
            > "$pull_pages"
          integrating_pr="$(
            jq -c --arg sha "$RELEASE_SHA" \
              '[.[][] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")]' \
              "$pull_pages"
          )"
          match_count="$(jq 'length' <<<"$integrating_pr")"
          if [ "$match_count" -ne 1 ]; then
            echo "::error::Release commit must have exactly one merged integrating PR on main."
            exit 1
          fi
          IFS=$'\t' read -r pr_number source_head_sha author_login < <(
            jq -r \
              '.[0] | [(.number | tostring), .head.sha, (.user.login // "")] | @tsv' \
              <<<"$integrating_pr"
          )
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Integrating PR did not expose one exact numeric PR identity."
            exit 1
          fi
          if ! [[ "$source_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Integrating PR did not expose one exact 40-hex source head."
            exit 1
          fi
          if ! [[ "$author_login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]; then
            echo "::error::Integrating PR did not expose one valid author identity."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "author_login=$author_login" >> "$GITHUB_OUTPUT"

      - name: Require required workflow evidence for integrating PR head
        id: required_workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ steps.integrating_pr.outputs.source_head_sha }}
          SOURCE_PR_NUMBER: ${{ steps.integrating_pr.outputs.pr_number }}
          SOURCE_AUTHOR: ${{ steps.integrating_pr.outputs.author_login }}
        run: |
          set -euo pipefail
          ruleset_pages="$(mktemp)"
          required_workflows="$(mktemp)"
          run_pages="$(mktemp)"
          reviews_pages="$(mktemp)"
          : > "$required_workflows"

          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100" \
            > "$ruleset_pages"

          max_required_approvals=0
          require_thread_resolution=false
          while IFS= read -r ruleset_id; do
            [ -n "$ruleset_id" ] || continue
            detail="$(mktemp)"
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
              > "$detail"

            if jq -e \
              '((.conditions.ref_name.exclude // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main"))' \
              "$detail" >/dev/null; then
              continue
            fi
            include_count="$(jq '(.conditions.ref_name.include // []) | length' "$detail")"
            if [ "$include_count" -gt 0 ] && ! jq -e \
              '((.conditions.ref_name.include // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main"))' \
              "$detail" >/dev/null; then
              echo "::error::Active branch ruleset ${ruleset_id} uses a main-match pattern this verifier cannot prove."
              exit 1
            fi

            jq -r \
              '.rules[]? | select(.type == "workflows") | .parameters.workflows[]? | [.path, (.repository_id | tostring), .ref] | @tsv' \
              "$detail" >> "$required_workflows"

            required_approvals="$(
              jq '[.rules[]? | select(.type == "pull_request") | (.parameters.required_approving_review_count // 0)] | max // 0' \
                "$detail"
            )"
            if [ "$required_approvals" -gt "$max_required_approvals" ]; then
              max_required_approvals="$required_approvals"
            fi
            if jq -e \
              '[.rules[]? | select(.type == "pull_request") | (.parameters.required_review_thread_resolution // false)] | any(. == true)' \
              "$detail" >/dev/null; then
              require_thread_resolution=true
            fi
            if jq -e \
              '[.rules[]? | select(.type == "pull_request") | (.parameters.require_code_owner_review // false)] | any(. == true)' \
              "$detail" >/dev/null; then
              echo "::error::Code-owner approval became mandatory; release verifier must gain an explicit eligibility proof first."
              exit 1
            fi
            if jq -e \
              '[.rules[]? | select(.type == "pull_request") | (.parameters.require_last_push_approval // false)] | any(. == true)' \
              "$detail" >/dev/null; then
              echo "::error::Last-push approval became mandatory; release verifier must gain an explicit last-pusher proof first."
              exit 1
            fi
            if jq -e \
              '[.rules[]? | select(.type == "pull_request") | (.parameters.required_reviewers // []) | length] | any(. > 0)' \
              "$detail" >/dev/null; then
              echo "::error::Explicit required reviewers became mandatory; release verifier must gain an eligibility proof first."
              exit 1
            fi
          done < <(
            jq -r '.[][] | select(.enforcement == "active" and .target == "branch") | .id' \
              "$ruleset_pages"
          )

          sort -u "$required_workflows" -o "$required_workflows"
          if [ ! -s "$required_workflows" ]; then
            echo "::error::No active required-workflow contract was observable for protected main."
            exit 1
          fi

          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_HEAD_SHA}&per_page=100" \
            > "$run_pages"

          security_scan_run_id=""
          strix_run_id=""
          while IFS=$'\t' read -r workflow_path workflow_repository_id workflow_ref; do
            [ -n "$workflow_path" ] || continue
            latest_run="$(
              jq -c --arg path "$workflow_path" --arg head "$SOURCE_HEAD_SHA" \
                '[.[] | .workflow_runs[]? | select(.path == $path and .head_sha == $head)] | sort_by(.created_at, .id) | last // empty' \
                "$run_pages"
            )"
            if [ -z "$latest_run" ]; then
              echo "::error::Missing required workflow evidence for ${workflow_path} on ${SOURCE_HEAD_SHA}."
              exit 1
            fi
            if [ "$(jq -r '.status' <<<"$latest_run")" != "completed" ] || \
               [ "$(jq -r '.conclusion' <<<"$latest_run")" != "success" ]; then
              echo "::error::Required workflow ${workflow_path} is not completed-success on the exact source head."
              exit 1
            fi
            if ! jq -e '.workflow_url | contains("/actions/required_workflows/")' \
              <<<"$latest_run" >/dev/null; then
              echo "::error::Workflow ${workflow_path} did not execute as repository-required workflow evidence."
              exit 1
            fi
            if [ "$workflow_path" = ".github/workflows/security-scan.yml" ]; then
              security_scan_run_id="$(jq -r '.id' <<<"$latest_run")"
            fi
            if [ "$workflow_path" = ".github/workflows/strix.yml" ]; then
              strix_run_id="$(jq -r '.id' <<<"$latest_run")"
            fi
            printf 'Verified required workflow %s from repository %s at %s.\n' \
              "$workflow_path" "$workflow_repository_id" "$workflow_ref"
          done < "$required_workflows"

          if [ -z "$security_scan_run_id" ]; then
            echo "::error::Live protected-main rules did not yield Security Scan evidence."
            exit 1
          fi
          echo "security_scan_run_id=$security_scan_run_id" >> "$GITHUB_OUTPUT"
          echo "strix_run_id=$strix_run_id" >> "$GITHUB_OUTPUT"

          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}/reviews?per_page=100" \
            > "$reviews_pages"
          approval_count="$(
            jq --arg head "$SOURCE_HEAD_SHA" --arg author "$SOURCE_AUTHOR" \
              '[.[][] | select(.user.login != $author)] | group_by(.user.login) | map(sort_by(.submitted_at, .id) | last) | map(select(.state == "APPROVED" and .commit_id == $head)) | length' \
              "$reviews_pages"
          )"
          if [ "$approval_count" -lt "$max_required_approvals" ]; then
            echo "::error::Exact source head has ${approval_count} qualifying non-author approvals; ${max_required_approvals} are required."
            exit 1
          fi

          if [ "$require_thread_resolution" = "true" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            repository_name="${GITHUB_REPOSITORY#*/}"
            thread_pages="$(mktemp)"
            gh api graphql --paginate --slurp \
              -F owner="$owner" \
              -F name="$repository_name" \
              -F number="$SOURCE_PR_NUMBER" \
              -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100, after: $endCursor) { nodes { isResolved } pageInfo { hasNextPage endCursor } } } } }' \
              > "$thread_pages"
            unresolved_threads="$(
              jq '[.[] | .data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false)] | length' \
                "$thread_pages"
            )"
            if [ "$unresolved_threads" -ne 0 ]; then
              echo "::error::Integrating PR retains ${unresolved_threads} unresolved review threads."
              exit 1
            fi
          fi

      - name: Require executed Dependency review action
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_SCAN_RUN_ID: ${{ steps.required_workflows.outputs.security_scan_run_id }}
        run: |
          set -euo pipefail
          job_pages="$(mktemp)"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_SCAN_RUN_ID}/jobs?per_page=100" \
            > "$job_pages"
          dependency_job_count="$(
            jq '[.[] | .jobs[]? | select(.name == "dependency-review")] | length' "$job_pages"
          )"
          if [ "$dependency_job_count" -ne 1 ]; then
            echo "::error::Security Scan must expose exactly one dependency-review job."
            exit 1
          fi
          if ! jq -e \
            '.[] | .jobs[]? | select(.name == "dependency-review" and .status == "completed" and .conclusion == "success")' \
            "$job_pages" >/dev/null; then
            echo "::error::dependency-review job did not complete successfully."
            exit 1
          fi
          if ! jq -e \
            '.[] | .jobs[]? | select(.name == "dependency-review") | .steps[]? | select(.name == "Dependency review" and .status == "completed" and .conclusion == "success")' \
            "$job_pages" >/dev/null; then
            echo "::error::Pinned Dependency review action was absent, skipped, or non-passing."
            exit 1
          fi

      - name: Require substantive Strix review evidence
        if: steps.required_workflows.outputs.strix_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STRIX_RUN_ID: ${{ steps.required_workflows.outputs.strix_run_id }}
        run: |
          set -euo pipefail
          strix_job_pages="$(mktemp)"
          annotation_pages="$(mktemp)"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${STRIX_RUN_ID}/jobs?per_page=100" \
            > "$strix_job_pages"
          strix_job_count="$(
            jq '[.[] | .jobs[]? | select(.name == "strix" and .status == "completed" and .conclusion == "success")] | length' \
              "$strix_job_pages"
          )"
          if [ "$strix_job_count" -ne 1 ]; then
            echo "::error::Required Strix workflow did not expose exactly one completed-success scan job."
            exit 1
          fi
          STRIX_CHECK_RUN_URL="$(
            jq -r \
              '.[] | .jobs[]? | select(.name == "strix" and .status == "completed" and .conclusion == "success") | (.check_run_url // "")' \
              "$strix_job_pages"
          )"
          if [ -z "$STRIX_CHECK_RUN_URL" ]; then
            echo "::error::Strix job did not expose a check-run URL."
            exit 1
          fi
          expected_check_run_prefix="https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/"
          if [[ "$STRIX_CHECK_RUN_URL" != "${expected_check_run_prefix}"* ]]; then
            echo "::error::Strix check-run URL did not belong to this repository."
            exit 1
          fi
          strix_check_run_id="${STRIX_CHECK_RUN_URL#${expected_check_run_prefix}}"
          if ! [[ "$strix_check_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Strix check-run URL did not expose one numeric check-run identity."
            exit 1
          fi
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/check-runs/${strix_check_run_id}/annotations?per_page=100" \
            > "$annotation_pages"
          if jq -e \
            '[.[][] | select(.title == "Strix backend unavailable")] | length > 0' \
            "$annotation_pages" >/dev/null; then
            echo "::error::Wrapper-green Strix run reported backend-unavailable review evidence."
            exit 1
          fi

  create-release-tag:
    name: Create or verify immutable release tag
    needs:
      - build-distributions
      - verify-release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the exact reviewed tag without moving an existing ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha'
          )"
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Protected main moved after artifact verification."
            exit 1
          fi
          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$RELEASE_SHA" ]; then
              echo "::error::Existing release tag points to a different commit."
              exit 1
            fi
            echo "Release tag already points to the exact reviewed commit."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA"

  publish-to-pypi:
    name: Publish to PyPI with OIDC
    needs:
      - build-distributions
      - verify-release-evidence
      - create-release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/egressweave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download canonical reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions-${{ github.sha }}
          path: dist
      - name: Publish release distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          attestations: true
          verbose: true
          print-hash: true

  publish-github-release:
    name: Publish checksummed GitHub Release after PyPI
    needs:
      - build-distributions
      - verify-release-evidence
      - create-release-tag
      - publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download complete reviewed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          observed_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha'
          )"
          if [ "$observed_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag moved after artifact verification."
            exit 1
          fi
      - name: Verify release evidence checksums
        working-directory: release-evidence
        run: sha256sum --check SHA256SUMS
      - name: Replace only a recoverable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.id, .draft] | @tsv' 2>/dev/null || true
          )"
          if [ -n "$existing_release" ]; then
            release_id="${existing_release%%$'\t'*}"
            release_is_draft="${existing_release#*$'\t'}"
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::A public GitHub Release already exists for this tag."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
      - name: Create a complete draft and publish it atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-evidence/* \
            --verify-tag \
            --draft \
            --title "EgressWeave ${RELEASE_TAG#v}" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
