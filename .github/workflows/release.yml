name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag in v<version> form
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  build-distributions:
    name: Build and verify release distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify stable release input and exact reviewed commit
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Stable publication must be dispatched from protected main."
            exit 1
          fi
          git fetch --no-tags origin main
          checked_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$checked_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked-out source does not match the workflow event commit."
            exit 1
          fi
          if [ "$checked_sha" != "$main_sha" ]; then
            echo "::error::Release source must equal the exact protected main head."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::A stable v<version> release tag is required."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Re-run exact-head quality gates
        run: |
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
      - name: Build wheel and source distribution
        run: |
          rm -rf dist publish-dist
          python -m hatchling build
      - name: Verify archives and bind them to the requested release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/ci/verify_distribution.py --release-ref "$RELEASE_TAG" --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-release-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Generate deterministic CycloneDX SBOM evidence
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one canonical wheel and source distribution."
            exit 1
          fi
          wheel_sbom="${wheels[0]}.cdx.json"
          sdist_sbom="${sdists[0]}.cdx.json"
          case "$wheel_sbom" in
            *.whl.cdx.json) ;;
            *) echo "::error::Wheel SBOM filename is not canonical."; exit 1 ;;
          esac
          case "$sdist_sbom" in
            *.tar.gz.cdx.json) ;;
            *) echo "::error::Source SBOM filename is not canonical."; exit 1 ;;
          esac
          python scripts/ci/generate_release_sbom.py \
            --artifact "${wheels[0]}" \
            --manifest scripts/ci/release_runtime_dependencies.json \
            --lock requirements-ci.txt \
            --output "$wheel_sbom"
          python scripts/ci/generate_release_sbom.py \
            --artifact "${sdists[0]}" \
            --manifest scripts/ci/release_runtime_dependencies.json \
            --lock requirements-ci.txt \
            --output "$sdist_sbom"
      - name: Finalize complete release evidence checksums
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          dist_dir = Path("dist")
          archives = sorted(
              [*dist_dir.glob("*.whl"), *dist_dir.glob("*.tar.gz")],
              key=lambda path: path.name,
          )
          sboms = sorted(dist_dir.glob("*.cdx.json"), key=lambda path: path.name)
          evidence = sorted([*archives, *sboms], key=lambda path: path.name)
          expected_evidence_count = 4
          if len(archives) != 2 or len(sboms) != 2 or len(evidence) != expected_evidence_count:
              raise SystemExit("release evidence must contain one wheel, one sdist, and two SBOMs")
          expected_sboms = {Path(f"{archive}.cdx.json") for archive in archives}
          if set(sboms) != expected_sboms:
              raise SystemExit("each canonical distribution must have one exact SBOM")

          checksum_lines: list[str] = []
          for evidence_path in evidence:
              digest = hashlib.sha256()
              with evidence_path.open("rb") as evidence_file:
                  for block in iter(lambda: evidence_file.read(1024 * 1024), b""):
                      digest.update(block)
              checksum_lines.append(f"{digest.hexdigest()}  {evidence_path.name}\n")
          (dist_dir / "SHA256SUMS").write_text(
              "".join(checksum_lines),
              encoding="ascii",
          )
          PYTHON
          (
            cd dist
            test "$(wc -l < SHA256SUMS)" -eq 4
            sha256sum --check SHA256SUMS
          )
      - name: Prepare the canonical PyPI-only artifact set
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Upload complete checksummed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload canonical PyPI distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions-${{ github.sha }}
          path: publish-dist/
          if-no-files-found: error
          retention-days: 14

  attest-release-evidence:
    name: Sign exact CycloneDX SBOM attestations
    needs:
      - build-distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download complete checksummed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Select and verify the exact evidence paths
        id: evidence
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release-evidence/*.whl)
          sdists=(release-evidence/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Attestation requires one canonical wheel and source distribution."
            exit 1
          fi
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          wheel_sbom="${wheel}.cdx.json"
          sdist_sbom="${sdist}.cdx.json"
          for evidence_path in "$wheel" "$sdist" "$wheel_sbom" "$sdist_sbom"; do
            if [ ! -f "$evidence_path" ]; then
              echo "::error::Required release evidence is missing."
              exit 1
            fi
          done
          (
            cd release-evidence
            test "$(wc -l < SHA256SUMS)" -eq 4
            sha256sum --check SHA256SUMS
          )
          {
            echo "wheel_path=$wheel"
            echo "wheel_name=$(basename "$wheel")"
            echo "wheel_sbom_path=$wheel_sbom"
            echo "sdist_path=$sdist"
            echo "sdist_name=$(basename "$sdist")"
            echo "sdist_sbom_path=$sdist_sbom"
          } >>"$GITHUB_OUTPUT"
      - name: Sign the wheel's exact CycloneDX SBOM
        id: attest-wheel
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.evidence.outputs.wheel_path }}
          sbom-path: ${{ steps.evidence.outputs.wheel_sbom_path }}
      - name: Sign the source distribution's exact CycloneDX SBOM
        id: attest-sdist
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.evidence.outputs.sdist_path }}
          sbom-path: ${{ steps.evidence.outputs.sdist_sbom_path }}
      - name: Stage immutable attestation bundles and checksums
        env:
          WHEEL_BUNDLE: ${{ steps.attest-wheel.outputs.bundle-path }}
          WHEEL_NAME: ${{ steps.evidence.outputs.wheel_name }}
          SDIST_BUNDLE: ${{ steps.attest-sdist.outputs.bundle-path }}
          SDIST_NAME: ${{ steps.evidence.outputs.sdist_name }}
        run: |
          set -euo pipefail
          mkdir release-attestations
          cp "$WHEEL_BUNDLE" "release-attestations/${WHEEL_NAME}.sbom-attestation.json"
          cp "$SDIST_BUNDLE" "release-attestations/${SDIST_NAME}.sbom-attestation.json"
          (
            cd release-attestations
            sha256sum *.json | LC_ALL=C sort -k2 > ATTESTATION_SHA256SUMS
            test "$(wc -l < ATTESTATION_SHA256SUMS)" -eq 2
            sha256sum --check ATTESTATION_SHA256SUMS
          )
      - name: Upload signed attestation bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestations-${{ github.sha }}
          path: release-attestations/
          if-no-files-found: error
          retention-days: 14

  verify-release-attestations:
    name: Verify exact signed SBOM evidence
    needs:
      - build-distributions
      - attest-release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact protected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the exact source checkout
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Download complete release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Download signed attestation bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-attestations-${{ github.sha }}
          path: attestation-evidence
      - name: Verify checksums and signed predicates against exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          (
            cd release-evidence
            test "$(wc -l < SHA256SUMS)" -eq 4
            sha256sum --check SHA256SUMS
          )
          (
            cd attestation-evidence
            test "$(wc -l < ATTESTATION_SHA256SUMS)" -eq 2
            sha256sum --check ATTESTATION_SHA256SUMS
          )
          wheels=(release-evidence/*.whl)
          sdists=(release-evidence/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Verification requires one canonical wheel and source distribution."
            exit 1
          fi
          mkdir verified-release-attestations
          verify_one() {
            artifact="$1"
            sbom="${artifact}.cdx.json"
            artifact_name="$(basename "$artifact")"
            bundle="attestation-evidence/${artifact_name}.sbom-attestation.json"
            verification="verified-release-attestations/${artifact_name}.verification.json"
            observed_predicate="${RUNNER_TEMP}/${artifact_name}.observed-predicate.json"
            expected_predicate="${RUNNER_TEMP}/${artifact_name}.expected-predicate.json"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json >"$verification"
            test "$(jq 'length' "$verification")" -eq 1
            jq -S '.[0].verificationResult.statement.predicate' \
              "$verification" >"$observed_predicate"
            jq -S . "$sbom" >"$expected_predicate"
            cmp "$observed_predicate" "$expected_predicate"
            cp "$bundle" "verified-release-attestations/$(basename "$bundle")"
          }
          verify_one "${wheels[0]}"
          verify_one "${sdists[0]}"
          (
            cd verified-release-attestations
            sha256sum *.json | LC_ALL=C sort -k2 > ATTESTATION_SHA256SUMS
            test "$(wc -l < ATTESTATION_SHA256SUMS)" -eq 4
            sha256sum --check ATTESTATION_SHA256SUMS
          )
      - name: Upload independently verified attestation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-attestations-${{ github.sha }}
          path: verified-release-attestations/
          if-no-files-found: error
          retention-days: 14

  create-release-tag:
    name: Create or verify immutable release tag
    needs:
      - build-distributions
      - verify-release-attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the exact reviewed tag without moving an existing ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha'
          )"
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Protected main moved after artifact verification."
            exit 1
          fi
          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$RELEASE_SHA" ]; then
              echo "::error::Existing release tag points to a different commit."
              exit 1
            fi
            echo "Release tag already points to the exact reviewed commit."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA"

  publish-to-pypi:
    name: Publish to PyPI with OIDC
    needs:
      - build-distributions
      - create-release-tag
      - verify-release-attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/egressweave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download canonical reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions-${{ github.sha }}
          path: dist
      - name: Publish release distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          attestations: true
          verbose: true
          print-hash: true

  publish-github-release:
    name: Publish checksummed GitHub Release after PyPI
    needs:
      - build-distributions
      - create-release-tag
      - verify-release-attestations
      - publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download complete reviewed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Download independently verified attestation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-attestations-${{ github.sha }}
          path: attestation-evidence
      - name: Verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          observed_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha'
          )"
          if [ "$observed_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag moved after artifact verification."
            exit 1
          fi
      - name: Verify release evidence checksums
        working-directory: release-evidence
        run: sha256sum --check SHA256SUMS
      - name: Verify signed attestation evidence checksums
        working-directory: attestation-evidence
        run: sha256sum --check ATTESTATION_SHA256SUMS
      - name: Replace only a recoverable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.id, .draft] | @tsv' 2>/dev/null || true
          )"
          if [ -n "$existing_release" ]; then
            release_id="${existing_release%%$'\t'*}"
            release_is_draft="${existing_release#*$'\t'}"
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::A public GitHub Release already exists for this tag."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
      - name: Create a complete draft and publish it atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-evidence/* attestation-evidence/* \
            --verify-tag \
            --draft \
            --title "EgressWeave ${RELEASE_TAG#v}" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
