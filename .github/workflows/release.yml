name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  build-distributions:
    name: Build and verify release distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Re-run exact-tag quality gates
        run: |
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          python -m hatchling build
      - name: Verify archives and bind them to the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/ci/verify_distribution.py \
            --dist-dir dist \
            --release-ref "$RELEASE_TAG"
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-release-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path("${GITHUB_WORKSPACE}")
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Upload reviewed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-to-pypi:
    name: Publish to PyPI with OIDC
    needs: build-distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/egressweave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist
      - name: Verify artifact checksums before requesting OIDC
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          attestations: true
          verbose: true
          print-hash: true

  attach-github-release-assets:
    name: Attach checksummed distributions to GitHub Release
    needs: build-distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Attach immutable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
