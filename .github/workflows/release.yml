name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag in v<version> form
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  build-distributions:
    name: Build and verify release distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify stable release input and exact reviewed commit
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Stable publication must be dispatched from protected main."
            exit 1
          fi
          git fetch --no-tags origin main
          checked_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$checked_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked-out source does not match the workflow event commit."
            exit 1
          fi
          if [ "$checked_sha" != "$main_sha" ]; then
            echo "::error::Release source must equal the exact protected main head."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::A stable v<version> release tag is required."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-release.txt
      - name: Install hash-locked quality and build toolchains
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --require-hashes -r requirements-release.txt
      - name: Re-run exact-head quality gates
        run: |
          ruff check .
          coverage run -m pytest -q
          coverage report -m
          python scripts/ci/hourly_product_guard.py self-test
          python -m compileall -q src tests scripts
      - name: Build wheel and source distribution
        run: |
          rm -rf dist publish-dist
          python -m hatchling build
      - name: Verify archives and bind them to the requested release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/ci/verify_distribution.py --release-ref "$RELEASE_TAG" --dist-dir dist
      - name: Smoke-test the installed wheel outside the source tree
        run: |
          smoke_environment="${RUNNER_TEMP}/egressweave-release-smoke"
          python -m venv "$smoke_environment"
          "$smoke_environment/bin/python" -m pip install \
            --require-hashes -r requirements-ci.txt
          "$smoke_environment/bin/python" -m pip install \
            --no-deps dist/egressweave-*.whl
          (
            cd "$RUNNER_TEMP"
            "$smoke_environment/bin/python" - <<'PY'
          import os
          import pathlib
          import tomllib

          import egressweave

          repository_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (repository_root / "pyproject.toml").open("rb") as pyproject_file:
              expected_version = tomllib.load(pyproject_file)["project"]["version"]
          if egressweave.__version__ != expected_version:
              raise SystemExit(
                  f"installed version {egressweave.__version__!r} did not match "
                  f"project version {expected_version!r}"
              )
          print(egressweave.__version__)
          PY
          )
      - name: Generate deterministic CycloneDX SBOMs
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel" && test -n "$sdist"
          python scripts/ci/generate_release_sbom.py \
            --artifact "$wheel" \
            --manifest scripts/ci/release_runtime_dependencies.json \
            --lock requirements-ci.txt \
            --output "${wheel}.cdx.json"
          python scripts/ci/generate_release_sbom.py \
            --artifact "$sdist" \
            --manifest scripts/ci/release_runtime_dependencies.json \
            --lock requirements-ci.txt \
            --output "${sdist}.cdx.json"
          (
            cd dist
            sha256sum *.whl *.tar.gz *.whl.cdx.json *.tar.gz.cdx.json \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Prepare the canonical PyPI-only artifact set
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Upload complete checksummed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload canonical PyPI distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions-${{ github.sha }}
          path: publish-dist/
          if-no-files-found: error
          retention-days: 14

  create-release-tag:
    name: Create or verify immutable release tag
    needs: build-distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the exact reviewed tag without moving an existing ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha'
          )"
          if [ "$current_main_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Protected main moved after artifact verification."
            exit 1
          fi
          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$RELEASE_SHA" ]; then
              echo "::error::Existing release tag points to a different commit."
              exit 1
            fi
            echo "Release tag already points to the exact reviewed commit."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA"

  attest-release-evidence:
    name: Sign and verify exact CycloneDX SBOM evidence
    needs:
      - build-distributions
      - create-release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download complete reviewed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Verify checksums and identify canonical subjects
        id: evidence
        run: |
          set -euo pipefail
          (
            cd release-evidence
            sha256sum --check SHA256SUMS
          )
          mapfile -t wheels < <(find release-evidence -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t sdists < <(find release-evidence -maxdepth 1 -type f -name '*.tar.gz' -print)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Attestation requires exactly one wheel and one source distribution."
            exit 1
          fi
          test -f "${wheels[0]}.cdx.json"
          test -f "${sdists[0]}.cdx.json"
          echo "wheel=${wheels[0]}" >>"$GITHUB_OUTPUT"
          echo "wheel_sbom=${wheels[0]}.cdx.json" >>"$GITHUB_OUTPUT"
          echo "sdist=${sdists[0]}" >>"$GITHUB_OUTPUT"
          echo "sdist_sbom=${sdists[0]}.cdx.json" >>"$GITHUB_OUTPUT"
      - name: Attest wheel SBOM
        id: attest_wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.evidence.outputs.wheel }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ steps.evidence.outputs.wheel_sbom }}
      - name: Attest source distribution SBOM
        id: attest_sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.evidence.outputs.sdist }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ steps.evidence.outputs.sdist_sbom }}
      - name: Verify signed SBOM attestations against repository and predicates
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL: ${{ steps.evidence.outputs.wheel }}
          WHEEL_SBOM: ${{ steps.evidence.outputs.wheel_sbom }}
          WHEEL_BUNDLE: ${{ steps.attest_wheel.outputs.bundle-path }}
          SDIST: ${{ steps.evidence.outputs.sdist }}
          SDIST_SBOM: ${{ steps.evidence.outputs.sdist_sbom }}
          SDIST_BUNDLE: ${{ steps.attest_sdist.outputs.bundle-path }}
        run: |
          set -euo pipefail
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "$WHEEL" \
            --bundle "$WHEEL_BUNDLE" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$signer_workflow" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json \
            --jq '.[0].verificationResult.statement.predicate' \
            > wheel.observed.cdx.json
          gh attestation verify "$SDIST" \
            --bundle "$SDIST_BUNDLE" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$signer_workflow" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json \
            --jq '.[0].verificationResult.statement.predicate' \
            > sdist.observed.cdx.json
          python - "$WHEEL_SBOM" wheel.observed.cdx.json \
            "$SDIST_SBOM" sdist.observed.cdx.json <<'PY'
          import json
          import pathlib
          import sys

          for expected_name, observed_name in zip(sys.argv[1::2], sys.argv[2::2]):
              expected = json.loads(pathlib.Path(expected_name).read_text(encoding="utf-8"))
              observed = json.loads(pathlib.Path(observed_name).read_text(encoding="utf-8"))
              if observed != expected:
                  raise SystemExit(
                      f"verified SBOM predicate did not match {expected_name!r}"
                  )
          PY
      - name: Preserve Sigstore bundles and refresh evidence checksums
        env:
          WHEEL_BUNDLE: ${{ steps.attest_wheel.outputs.bundle-path }}
          SDIST_BUNDLE: ${{ steps.attest_sdist.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$WHEEL_BUNDLE" release-evidence/wheel.sbom.attestation.json
          cp "$SDIST_BUNDLE" release-evidence/sdist.sbom.attestation.json
          (
            cd release-evidence
            sha256sum *.whl *.tar.gz *.cdx.json *.attestation.json \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload attested release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14

  publish-to-pypi:
    name: Publish to PyPI with OIDC
    needs:
      - build-distributions
      - create-release-tag
      - attest-release-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/egressweave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download canonical reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions-${{ github.sha }}
          path: dist
      - name: Publish release distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          attestations: true
          verbose: true
          print-hash: true

  publish-github-release:
    name: Publish checksummed GitHub Release after PyPI
    needs:
      - build-distributions
      - create-release-tag
      - attest-release-evidence
      - publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download complete attested release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: attested-release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          observed_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha'
          )"
          if [ "$observed_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag moved after artifact verification."
            exit 1
          fi
      - name: Verify release evidence checksums
        working-directory: release-evidence
        run: sha256sum --check SHA256SUMS
      - name: Replace only a recoverable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.id, .draft] | @tsv' 2>/dev/null || true
          )"
          if [ -n "$existing_release" ]; then
            release_id="${existing_release%%$'\t'*}"
            release_is_draft="${existing_release#*$'\t'}"
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::A public GitHub Release already exists for this tag."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
      - name: Create a complete draft and publish it atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-evidence/* \
            --verify-tag \
            --draft \
            --title "EgressWeave ${RELEASE_TAG#v}" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
