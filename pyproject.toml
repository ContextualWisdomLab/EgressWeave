[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egressweave"
version = "0.3.0"
description = "SSRF- and DNS-rebinding-safe outbound HTTP clients: exact egress authorities plus DNS-pinned httpx transports."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Contextual Wisdom Lab" }]
keywords = [
    "ssrf",
    "dns-rebinding",
    "egress",
    "allowlist",
    "httpx",
    "security",
    "http-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<2.0",
    "idna>=3.18,<4",
]

[project.optional-dependencies]
test = [
    "coverage>=7.15.3,<8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/egressweave"
Repository = "https://github.com/ContextualWisdomLab/egressweave"
Issues = "https://github.com/ContextualWisdomLab/egressweave/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/egressweave"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["egressweave"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
